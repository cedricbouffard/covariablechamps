# Workflow for building and deploying pkgdown site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system libraries for rlas/lidR compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libsqlite3-dev liblzma-dev zlib1g-dev pkg-config

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Diagnostic du build
        if: always()
        run: |
          library(pak, lib.loc = Sys.getenv("R_LIB_FOR_PAK"))
          res <- tryCatch(
            pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE),
            error = function(e) e
          )
          if (inherits(res, "error")) {
            msg <- substr(gsub("\n", " | ", conditionMessage(res)), 1, 1500)
            cat("::error::BUILD_FAIL: ", msg, "\n", sep = "")
            quit(status = 1)
          }
          cat("::notice::BUILD_OK\n")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: docs

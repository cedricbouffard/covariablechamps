# Workflow for building and deploying pkgdown site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system libraries for rlas/lidR compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libsqlite3-dev liblzma-dev zlib1g-dev pkg-config

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Diagnostic dependencies (reproduit l'echec de setup-r-dependencies)
        if: always()
        run: |
          library(pak, lib.loc = Sys.getenv("R_LIB_FOR_PAK"))
          lib <- tempfile("pkglib")
          dir.create(lib)
          err <- function(label, e) {
            msg <- substr(gsub("\n", " | ", conditionMessage(e)), 1, 1500)
            cat("::error::", label, ": ", msg, "\n", sep = "")
          }
          res1 <- tryCatch(pak::lockfile_create(
            c("deps::.", "any::sessioninfo", "any::pkgdown", "local::."),
            lockfile = tempfile(fileext = ".lock"),
            dependencies = c("Config/Needs/website", "all"),
            upgrade = FALSE, lib = NULL
          ), error = function(e) e)
          if (inherits(res1, "error")) {
            err("LOCKFILE_FAIL", res1)
          } else {
            cat("::notice::LOCKFILE_OK\n")
            res2 <- tryCatch(pak::pkg_install(
              c("r-lidar/rlas", "r-lidar/lidR", "cran/lidaRtRee"),
              lib = lib
            ), error = function(e) e)
            if (inherits(res2, "error")) {
              err("GH_INSTALL_FAIL", res2)
            } else {
              cat("::notice::GH_INSTALL_OK\n")
              res3 <- tryCatch(
                pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE),
                error = function(e) e
              )
              if (inherits(res3, "error")) {
                err("BUILD_FAIL", res3)
              } else {
                cat("::notice::BUILD_OK\n")
              }
            }
          }
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: docs
